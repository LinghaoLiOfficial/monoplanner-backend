services:
  db:
    profiles:
      - local-db
    image: postgres:17-alpine
    container_name: context-orchestrator-postgres
    environment:
      POSTGRES_DB: context_orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d context_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: context-orchestrator-api
    environment:
      APP_NAME: Fullstack Context Orchestrator API
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg://llh@host.docker.internal:5432/context_orchestrator
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
    container_name: context-orchestrator-worker
    environment:
      APP_NAME: Fullstack Context Orchestrator API
      DATABASE_URL: postgresql+psycopg://llh@host.docker.internal:5432/context_orchestrator
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_THINKING: ${LLM_THINKING:-false}
      QUEUE_WORKER_CONCURRENCY: ${QUEUE_WORKER_CONCURRENCY:-1}
      QUEUE_POLL_INTERVAL_SECONDS: ${QUEUE_POLL_INTERVAL_SECONDS:-2}
      QUEUE_STALE_AFTER_SECONDS: ${QUEUE_STALE_AFTER_SECONDS:-900}
      QUEUE_WORKER_HEARTBEAT_TIMEOUT_SECONDS: ${QUEUE_WORKER_HEARTBEAT_TIMEOUT_SECONDS:-15}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      QUEUE_WORKER_ID: ${QUEUE_WORKER_ID:-}
    command: uv run python -m app.workers.generation_worker

volumes:
  postgres_data:
