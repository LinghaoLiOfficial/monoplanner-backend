services:
  db:
    image: postgres:17-alpine
    container_name: context-orchestrator-postgres
    environment:
      POSTGRES_DB: context_orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d context_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: context-orchestrator-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Fullstack Context Orchestrator API
      APP_ENV: development
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@db:5432/context_orchestrator
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
