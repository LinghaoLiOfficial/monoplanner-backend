[project]
name = "fullstack-forge-backend"
version = "0.1.0"
description = "Fullstack Forge backend built with FastAPI, Uvicorn, SQLAlchemy 2.x, Alembic, PostgreSQL, and uv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "greenlet>=3.2.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "instructor>=1.15.4",
    "jinja2>=3.1.0,<4.0.0",
    "json-repair>=0.62.0",
    "openai>=2.53.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
